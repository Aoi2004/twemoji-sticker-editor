<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111318">
    <title>Twemoji Sticker Editor</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="./styles.css?v=10">
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" defer></script>
    <script src="./emoji-data.js?v=1" defer></script>
    <script src="./app.js?v=8" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel tool-panel" aria-label="編集ツール">
        <div class="brand">
          <h1>Twemoji Sticker Editor</h1>
          <label class="theme-control" for="themeToggle">
            <span id="themeLabel">ダーク</span>
            <input id="themeToggle" type="checkbox" role="switch" aria-label="テーマを切り替え">
            <span class="theme-switch" aria-hidden="true"></span>
          </label>
        </div>

        <label class="upload-zone" for="imageInput">
          <input id="imageInput" type="file" accept="image/*">
          <span class="upload-title">画像を選択</span>
          <span class="upload-copy">PNG / JPG / WebP</span>
        </label>

        <div class="toolbar" aria-label="ファイル操作">
          <button id="fitButton" type="button" title="表示を合わせる">⛶</button>
          <button id="undoButton" type="button" title="元に戻す">↶</button>
          <button id="redoButton" type="button" title="やり直す">↷</button>
          <button id="clearButton" type="button" title="選択中のスタンプを削除">⌫</button>
        </div>

        <section class="control-group">
          <div class="group-head">
            <h2>スタンプ</h2>
            <input id="emojiSearch" type="search" placeholder="英語名・絵文字で検索">
          </div>
          <div id="emojiCategories" class="emoji-categories" role="tablist" aria-label="スタンプカテゴリ"></div>
          <div id="emojiGrid" class="emoji-grid" aria-label="Twemojiスタンプ一覧"></div>
        </section>

        <button id="downloadButton" class="primary-action" type="button">PNGを書き出す</button>
        <div class="clipboard-actions" aria-label="クリップボード操作">
          <button id="copyImageButton" type="button" title="編集結果を画像としてコピー">画像をコピー</button>
          <button id="pasteImageButton" type="button" title="クリップボードの画像を読み込む">画像を貼り付け</button>
        </div>

        <footer class="app-footer">
          <p>画像の編集、書き出し、コピー、貼り付けはこのブラウザ内で完結します。画像ファイルはサーバーへ送信されません。</p>
          <p>Twemojiスタンプは初回表示時にjsDelivrから取得します。</p>
          <div class="app-links">
            <a href="https://github.com/Aoi2004/twemoji-sticker-editor" target="_blank" rel="noreferrer">GitHubリポジトリ</a>
            <a href="https://github.com/Aoi2004/twemoji-sticker-editor/blob/main/LICENSES.md" target="_blank" rel="noreferrer">ライセンスとクレジット</a>
          </div>
        </footer>
      </aside>

      <section class="stage-wrap" aria-label="編集キャンバス">
        <div class="stage-top">
          <div>
            <strong id="fileName">未選択</strong>
            <span id="statusText">画像を読み込むと編集できます</span>
          </div>
          <div class="zoom-controls">
            <button id="zoomOutButton" type="button" title="縮小">−</button>
            <span id="zoomValue">100%</span>
            <button id="zoomInButton" type="button" title="拡大">＋</button>
          </div>
        </div>
        <div id="stageViewport" class="stage-viewport">
          <canvas id="editorCanvas" width="1280" height="720" aria-label="画像編集キャンバス"></canvas>
        </div>
      </section>
    </main>
  </body>
</html>
